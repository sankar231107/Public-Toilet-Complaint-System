<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🚻 Toilet Block Details</h1>

    <div class="details-card">

        <h2 id="blockName"></h2>

        <table class="details-table">

            <tr>
                <th>Record ID</th>
                <td id="recordId"></td>
            </tr>

            <tr>
                <th>Location</th>
                <td id="location"></td>
            </tr>

            <tr>
                <th>Last Cleaned</th>
                <td id="cleanDate"></td>
            </tr>

            <tr>
                <th>No. of Complaints</th>
                <td id="complaints"></td>
            </tr>

            <tr>
                <th>Status</th>
                <td id="status"></td>
            </tr>

            <tr>
                <th>Days Since Last Cleaning</th>
                <td id="days"></td>
            </tr>

        </table>

    </div>

    <br>

    <button onclick="goBack()">⬅ Back to Dashboard</button>

</div>

<script src="details.js"></script>

</body>
</html>
